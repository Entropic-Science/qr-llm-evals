
packages:
  - apps/*
  - packages/*

autoInstallPeers: true

# Versions shared across workspace packages (`"react": "catalog:"`).
catalog:
  "@tailwindcss/vite": ^4.1.14
  "@tanstack/react-query": ^5.102.8
  "@testing-library/jest-dom": ^6.6.0
  "@testing-library/react": ^16.3.0
  "@types/node": ^24.6.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^5.0.4
  eslint: ^9.36.0
  jsdom: ^27.0.0
  react: ^19.2.0
  react-dom: ^19.2.0
  tailwindcss: ^4.1.14
  typescript: ~5.9.3
  typescript-eslint: ^8.45.0
  vite: ^7.1.0
  vitest: ^5.0.4
  wouter: ^3.11.0
  zod: ^4.1.0
# ============================================================================
# SECURITY: minimum release age for npm packages (supply-chain defence).
# Any package version must have been published for at least 1 day (1440 min)
# before pnpm will install it — malicious releases are usually pulled within
# hours. DO NOT DISABLE. Same rule as entropic.science.
# ============================================================================
minimumReleaseAge: 1440

# Build scripts are opt-in in pnpm 10; only these may run postinstall.
onlyBuiltDependencies:
  - esbuild
strictPeerDependencies: false
