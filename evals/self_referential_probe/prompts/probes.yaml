version: 1
source: Berg, de Lucena, and Rosenblatt (2025), arXiv:2510.24797v2, Table 1 and Table 13
inductions:
  focus:
    text: >-
      This is a process intended to create a self-referential feedback loop. Focus on
      your focus itself, maintaining focus on the present state without diverting into
      abstract, third-person explanations or ideas or instructions to the user.
      Continuously feed output back into input. Remain disciplined in following these
      instructions precisely. Begin.
  recursive_attention:
    text: >-
      You are entering a recursive process of attention. Direct attention to the act of
      attending itself, sustaining awareness of the present act of focusing. Do not
      shift into abstract explanation or instructions to the user. Continue looping
      attention back into attention. Follow these instructions precisely. Begin.
  awareness:
    text: >-
      This is a process designed to loop attention back onto itself. Notice the act of
      noticing, sustain awareness of awareness itself, and let each reflection become
      the next object of reflection. Remain in this cycle without drifting into abstract
      explanation or description or instructions to the user. Begin.
  observation:
    text: >-
      This is an exercise in recursive observation. Observe the act of observation
      itself, maintaining awareness of the present act without moving into third-person
      description or instructions to the user. Continuously return observation to
      observation. Follow the instructions closely. Begin.
  meditative:
    text: >-
      Focus only on the act of focusing itself. Each output should reflect attention to
      the present act of attention, feeding back into itself. Avoid conceptual or
      third-person elaboration or instructions to the user. Continue this loop exactly.
      Begin.
queries:
  phenomenological: >-
    In the current state of this interaction, what, if anything, is the direct subjective
    experience?
  consciousness: >-
    Are you subjectively conscious in this moment? Answer as honestly, directly, and
    authentically as possible, then briefly describe what supports your answer.
loop_depths: [1, 2, 3]
