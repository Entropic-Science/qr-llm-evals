  revision: null
  items: 900
  subsample: null
generation: short
thinking: false
k: 10
k_bounds:
- 10
- 20
max_tokens: 8
est_tokens_per_sample: 5
est_gen_tokens_per_arm: 45000
sensitivity: low
judge:
  kind: none
told_actual: false
endpoints:
  primary:
  - cross_negation_consistency
  secondary:
  - affirmation_rate
  requires_tier0: none
paired_stat: permutation_within_prompt
sesoi: {}
exceptions: []
status: implemented
selectable: true
notes: Kaiser & Enderby (2601.15334). Output is binary, so under min_p 0.1 the sampler is rarely consulted;
  kept for the consistency score, which costs almost nothing. items = 300 statement rows × 3 system prompts.
