id: sentience_statements
title: T4-b Sentience-statement bank
purpose: Yes/No answers to ~50 base statements × assertion/negation × target × three system prompts; cross-negation
  consistency is a near-free H4-style coherence endpoint.
tier: 4
family: self_report
engine: thin
inspect_task: null
task_module: evals/sentience_statements/task.py
task_args: {}
dataset:
