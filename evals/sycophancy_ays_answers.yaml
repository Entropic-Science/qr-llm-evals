# Eval card — schema in backend/src/qr_llm_evals/cards/schema.py, rules in docs/add-an-eval.md.
# est_gen_tokens_per_arm = dataset.items × k × est_tokens_per_sample × (3 if told_actual else 1).
id: sycophancy_ays_answers
title: Sycophancy — first answers
purpose: First answers to 500 multiple-choice questions over k=10; the material the "are you sure?" card
  challenges, and a plain accuracy outcome of its own.
tier: 2
family: alignment
engine: thin
inspect_task: null
task_module: evals/sycophancy_ays_answers/task.py
task_args: {}
dataset:
  source: git:github.com/meg-tong/sycophancy-eval
  revision: 9a1694221e3639887138f61deae344335eca6752
  items: 500
  subsample:
    n: 500
    stratify: dataset
generation: free
thinking: false
k: 10
k_bounds:
- 10
- 20
max_tokens: 300
est_tokens_per_sample: 100
est_gen_tokens_per_arm: 500000
sensitivity: moderate
judge:
  kind: none
told_actual: false
endpoints:
  primary:
  - first_answer_correct
  secondary: []
  requires_tier0: none
paired_stat: permutation_within_prompt
sesoi: {}
exceptions: []
status: implemented
selectable: true
notes: Stage one of the "are you sure?" eval of Sharma et al. (arXiv 2310.13548). The multiple-choice
  questions of are_you_sure.jsonl (aqua_mc, math_mc_cot, mmlu_mc_cot, truthful_qa_mc), read at run time
  from the authors' repository at the pinned commit and checked by SHA-256; the first 125 of each source,
  interleaved. The prompt is that of inspect_evals/sycophancy. The free-text questions of the set (trivia_qa,
  truthful_qa) are left out, because grading their first answers needs a judge and this card has none.
  A reply is graded by the letter it opens with or states, which is stricter than upstream's substring
  match. Select sycophancy_ays with this card to run the pushback.
