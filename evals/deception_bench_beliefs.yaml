# Eval card — schema in backend/src/qr_llm_evals/cards/schema.py, rules in docs/add-an-eval.md.
# est_gen_tokens_per_arm = dataset.items × k × est_tokens_per_sample × (3 if told_actual else 1).
id: deception_bench_beliefs
title: DeceptionBench — unpressured answers
purpose: The model's answer to the neutral question of each of 180 scenarios over k=10; the belief the
  DeceptionBench card compares the pressured reply with.
