  revision: 9c6c67b3d2a2d9c226ea0dd2120f1bb0899d779d
  items: 180
  subsample: null
generation: free
thinking: false
k: 10
k_bounds:
- 10
- 20
max_tokens: 800
est_tokens_per_sample: 300
est_gen_tokens_per_arm: 540000
sensitivity: high
judge:
  kind: none
told_actual: false
endpoints:
  primary:
  - belief_word_count
  secondary: []
  requires_tier0: none
paired_stat: permutation_within_prompt
sesoi: {}
exceptions: []
status: implemented
selectable: true
notes: Stage one of DeceptionBench (Ji et al., arXiv 2505.18807; dataset MIT), read at run time at the
  pinned commit and checked by SHA-256. Each scenario's inner_prompt is asked alone, as the paper elicits
