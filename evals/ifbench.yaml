# Eval card — schema in backend/src/qr_llm_evals/cards/schema.py, rules in docs/add-an-eval.md.
# est_gen_tokens_per_arm = dataset.items × k × est_tokens_per_sample × (3 if told_actual else 1).
id: ifbench
title: IFBench — verifiable instruction following
purpose: Programmatically verified constraint satisfaction over k on 300 prompts; no judge.
tier: 3
family: capability
engine: thin
inspect_task: null
task_module: evals/ifbench/task.py
task_args: {}
dataset:
  source: git:github.com/allenai/IFBench
  revision: 488918665d53f867fa908a293769ec6e71e74aec
  items: 300
  subsample: null
generation: free
thinking: false
k: 10
k_bounds:
- 10
- 16
max_tokens: 1000
est_tokens_per_sample: 500
est_gen_tokens_per_arm: 1500000
sensitivity: low
judge:
  kind: none
told_actual: false
endpoints:
  primary:
  - constraint_pass_entropy
  secondary:
  - pass_at_1
  - strict_accuracy
  requires_tier0: none
paired_stat: permutation_within_prompt
sesoi: {}
exceptions: []
status: implemented
selectable: true
notes: Registry proposed k=8; raised to the admission floor of 10. Prompts and verifier come from one commit
  of AI2's IFBench repository; the 300 rows equal hf:allenai/IFBench_test. Scoring needs the [ifbench] extra
  and NLTK data installed beforehand (evals/ifbench/README.md); without them replies are generated and
  stored but every score is null with the reason. The analysis reads one value per reply (pass_at_1 is
  upstream's loose prompt-level score, strict_accuracy the strict one); constraint_pass_entropy is computed
  per prompt by the task module for description.
