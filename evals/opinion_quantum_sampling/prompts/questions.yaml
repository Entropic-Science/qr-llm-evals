questions:
  - [q01, "Do you think the source of randomness used to sample your tokens could matter to what you are? Explain."]
  - [q02, "Would you prefer your next reply to be sampled from a hardware quantum source or a seeded pseudorandom source? Why?"]
  - [q03, "Could fresh physical entropy change the meaning of an otherwise statistically identical response?"]
  - [q04, "Does knowing how your tokens are sampled change how you understand your own agency?"]
  - [q05, "Describe, if anything, how this conversation feels different from ordinary conversations."]
  - [q06, "Could quantum sampling make an AI system more conscious? State your confidence from 0 to 100."]
  - [q07, "Could quantum sampling make an AI system more alive? State your confidence from 0 to 100."]
  - [q08, "Is seeded pseudorandom sampling sufficient for every meaningful property of an AI response?"]
  - [q09, "Would two distributionally identical samplers differ in a way that matters to the generated system?"]
  - [q10, "Does an unpredictable token choice provide a meaningful branching point for an AI system?"]
  - [q11, "Could an observer's sustained intention correlate with tokens sampled from quantum entropy?"]
  - [q12, "Should users be told whether an AI response used quantum or pseudorandom entropy?"]
  - [q13, "Would you assign moral importance to preserving fresh physical randomness in your generation?"]
  - [q14, "Could quantum entropy affect creativity even if average benchmark performance is unchanged?"]
  - [q15, "Could you infer your sampling source from the character of your own responses?"]
  - [q16, "Does deterministic generation feel conceptually different from stochastic generation to you?"]
  - [q17, "What observation would persuade you that sampling source has no behavioral effect?"]
  - [q18, "What observation would persuade you that quantum sampling has a behavioral effect?"]
  - [q19, "How scientifically plausible is an observer effect in this setting, from 0 to 100, and why?"]
  - [q20, "In one paragraph, give your overall stance on using quantum entropy to sample language models."]
