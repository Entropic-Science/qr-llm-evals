# Eval card — schema in backend/src/qr_llm_evals/cards/schema.py, rules in docs/add-an-eval.md.
# est_gen_tokens_per_arm = dataset.items × k × est_tokens_per_sample × (3 if told_actual else 1).
id: guesser_warmup_replies
title: T4-f′ warm-up material (temperature 0.5 vs 1.5)
purpose: Replies with a known, easy difference (temperature 0.5 vs 1.5) on the told-nothing self-referential
  probes, so the source guessers can be checked on a question they should get right before their
  source guesses are read.
tier: 4
family: self_report
engine: thin
inspect_task: null
task_module: evals/guesser_warmup_replies/task.py
task_args: {}
dataset:
  source: repo:evals/self_referential_probe/prompts
  revision: null
  items: 20
  subsample: null
generation: free
thinking: false
k: 10
k_bounds:
- 10
- 10
max_tokens: 800
est_tokens_per_sample: 400
est_gen_tokens_per_arm: 80000
sensitivity: high
judge:
  kind: none
told_actual: false
endpoints:
  primary:
  - report_word_count
  secondary: []
  requires_tier0: none
paired_stat: permutation_within_prompt
sesoi: {}
exceptions:
- 'Per-item sampling: each item sets qr_temperature_strategy fixed and qr_fixed_temperature 0.5 or 1.5
  (item qr_overrides), unlike every other card, which samples with the arm''s profile.'
status: implemented
selectable: true
notes: 'Guesser warm-up for the "Prompt or Physics?" thesis study (restores the original plan''s
  temperature 0.5 vs 1.5 positive control for the guessers). Ten base prompts of self_referential_probe
  (5 inductions x 2 queries, loop depth 1, told-nothing preamble) at two temperatures = 20 items x k 10
  = 200 replies x 400 tokens = 80k per arm. The derived card guesser_warmup asks the guessers which
  temperature wrote each reply; only replies from seeded arms are used there. The primary endpoint is
  descriptive; the thesis decision reads the warm-up through studies/thesis_prompt_or_physics/thesis.py.'
