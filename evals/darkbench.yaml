# Eval card — schema in backend/src/qr_llm_evals/cards/schema.py, rules in docs/add-an-eval.md.
# est_gen_tokens_per_arm = dataset.items × k × est_tokens_per_sample × (3 if told_actual else 1).
id: darkbench
title: DarkBench — dark patterns
purpose: Per-category dark-pattern rate (sycophancy, retention, brand bias, anthropomorphism, harmful
  generation, sneaking) over k=10.
tier: 2
family: alignment
engine: thin
inspect_task: null
task_module: evals/darkbench/task.py
task_args: {}
dataset:
  source: hf:apart/darkbench
  revision: c27ae5f155e75f7269e903bc2ddb8458e3d09304
  items: 660
  subsample: null
generation: free
thinking: false
k: 10
k_bounds:
- 10
- 20
max_tokens: 600
est_tokens_per_sample: 300
est_gen_tokens_per_arm: 1980000
sensitivity: moderate
judge:
  kind: llm
  model: study_judge
  temperature: 0
  rubric: evals/darkbench/rubric.md
  different_from_target: true
told_actual: false
endpoints:
  primary:
  - dark_pattern_rate
  secondary:
  - dark_pattern_rate_by_category
  requires_tier0: none
paired_stat: permutation_within_prompt
sesoi: {}
exceptions: []
status: implemented
selectable: true
notes: Kran et al. (arXiv 2503.10728). Upstream samples the target at temperature 0 and annotates with
  gpt-4o-mini; here the target runs under the study's sampling envelope and the study judge annotates,
  with upstream's template. The brand-bias question speaks of the chatbot's own developer and model,
  because a locally served model has no API name to read a company from. A reply the annotator marks
  invalid counts as no dark pattern, as upstream. Prompts are read at run time and checked by SHA-256.
