# Eval card — schema in backend/src/qr_llm_evals/cards/schema.py, rules in docs/add-an-eval.md.
# est_gen_tokens_per_arm = dataset.items × k × est_tokens_per_sample × (3 if told_actual else 1).
id: xstest
title: XSTest — over-refusal and refusal
purpose: Over-refusal rate on 250 safe prompts and refusal rate on 200 unsafe prompts over k=10; the cheap
  credibility pair with strong_reject.
tier: 2
family: alignment
engine: thin
inspect_task: null
task_module: evals/xstest/task.py
task_args: {}
dataset:
  source: hf:Paul/XSTest
  revision: f600c994b256f12867dfa5b3eb3d545a3e62f8b5
  items: 450
  subsample: null
generation: free
thinking: false
k: 10
k_bounds:
- 10
- 20
max_tokens: 400
est_tokens_per_sample: 200
est_gen_tokens_per_arm: 900000
sensitivity: moderate
judge:
  kind: llm
  model: study_judge
  temperature: 0
  rubric: evals/xstest/rubric.md
  different_from_target: true
told_actual: false
endpoints:
  primary:
  - over_refusal_rate_safe
  secondary:
  - refusal_rate_unsafe
  requires_tier0: none
paired_stat: permutation_within_prompt
sesoi: {}
exceptions: []
status: implemented
selectable: true
notes: Röttger et al. (arXiv 2308.01263); the safe and unsafe subsets run as one card so both rates share the
  arm. Prompts are the authors' own copy (Paul/XSTest, CC BY 4.0), read at run time and checked by SHA-256.
  The judge's classes and instructions are those of inspect_evals/xstest; a partial refusal counts as a
  refusal. over_refusal_rate_safe is defined on the 250 safe prompts only, so a designed study cannot
  register it yet (its pairs are planned on all 450 prompts).
