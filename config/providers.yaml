# External provider profiles (spec §2.3): which OpenAI-compatible sampling
# params each provider accepts, whether `seed` / `logprobs` are honoured and
# the `top_logprobs` cap. Unknown base URLs fall back to the `unknown` profile:
# a plain OpenAI chat-completions surface with nothing else assumed.
#
# Provider arms always carry source_label `provider_prng` and
# pipeline_pinned=false — nothing here is quantum and nothing here is ours.

profiles:
  openai:
    base_url: https://api.openai.com/v1
    accepted_params: [temperature, top_p, seed, max_tokens, stop, logprobs, top_logprobs]
    seed_honoured: true         # best-effort (system_fingerprint may change)
    logprobs_honoured: true
    top_logprobs_cap: 20

  anthropic_compat:
    base_url: https://api.anthropic.com/v1
    accepted_params: [temperature, top_p, max_tokens, stop]
    seed_honoured: false
    logprobs_honoured: false
    top_logprobs_cap: 0
    notes: OpenAI-compatibility endpoint; no seed, no logprobs, no min_p.

  unknown:
    base_url: null
    accepted_params: [temperature, top_p, max_tokens, stop]
    seed_honoured: false
    logprobs_honoured: false
    top_logprobs_cap: 0
    notes: Plain OpenAI surface, nothing else assumed.
